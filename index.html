
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ed">
  <title>Devi & Shubham | A Story in Two Cities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="website">
    <div class="artwork-container">
      <img
        src="wedding-design.png"
        class="wedding-artwork"
        alt="Devi and Shubham — A Story in Two Cities"
      >

      <!--
        HOTSPOT POSITIONS ARE TEMPORARY.
        Adjust left, top, width and height after checking your Canva image.
        Values are percentages of the image dimensions.
      -->

      <button class="hotspot"
        style="--x:10%; --y:72%; --w:23%; --h:7%;"
        data-feature="pass"
        aria-label="Open Wedding Pass"
        title="Wedding Pass"></button>

      <button class="hotspot"
        style="--x:36%; --y:72%; --w:25%; --h:7%;"
        data-feature="countdown"
        aria-label="Open Wedding Countdown"
        title="Countdown"></button>

      <button class="hotspot"
        style="--x:64%; --y:72%; --w:25%; --h:7%;"
        data-feature="quiz"
        aria-label="Open Wedding Quiz"
        title="Wedding Quiz"></button>

      <button class="hotspot"
        style="--x:10%; --y:83%; --w:23%; --h:7%;"
        data-feature="rsvp"
        aria-label="Open RSVP"
        title="RSVP"></button>

      <button class="hotspot"
        style="--x:36%; --y:83%; --w:25%; --h:7%;"
        data-feature="map"
        aria-label="Open Wedding Map"
        title="Map"></button>

      <button class="hotspot"
        style="--x:64%; --y:83%; --w:25%; --h:7%;"
        data-feature="guestbook"
        aria-label="Open Guestbook"
        title="Guestbook"></button>

      <button class="hotspot"
        style="--x:25%; --y:94%; --w:50%; --h:5%;"
        data-feature="travel"
        aria-label="Open Travel Guide"
        title="Travel Guide"></button>
    </div>
  </main>

  <!-- Feature popup -->
  <div class="modal" id="featureModal" aria-hidden="true">
    <div class="modal-content" role="dialog"
      aria-modal="true" aria-labelledby="modalTitle">

      <button class="close-button" id="closeModal"
        aria-label="Close popup">&times;</button>

      <h2 id="modalTitle">Welcome</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
