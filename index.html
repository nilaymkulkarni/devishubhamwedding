<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ed">
  <title>Devi & Shubham | A Story in Two Cities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="website">
    <div class="artwork-container">
      <img src="wedding-design.png" class="wedding-artwork"
           alt="Devi and Shubham — A Story in Two Cities">

      <!-- Live countdown: displayed automatically, without clicking -->
      <div class="live-countdown" id="liveCountdown"
           aria-label="Countdown to the wedding" aria-live="off"></div>

      <!-- Header brand and navigation -->
      <button class="hotspot" style="--x:13.8%;--y:0.5%;--w:18.0%;--h:4.0%" data-feature="story" aria-label="Devi and Shubham home"></button>
      <button class="hotspot" style="--x:37.4%;--y:1.3%;--w:7.0%;--h:2.6%" data-feature="story" aria-label="Our Story"></button>
      <button class="hotspot" style="--x:45.3%;--y:1.3%;--w:5.2%;--h:2.6%" data-feature="events" aria-label="Events"></button>
      <button class="hotspot" style="--x:51.8%;--y:1.3%;--w:6.4%;--h:2.6%" data-feature="map" aria-label="City Map"></button>
      <button class="hotspot" style="--x:59.2%;--y:1.3%;--w:6.0%;--h:2.6%" data-feature="memories" aria-label="Memories"></button>
      <button class="hotspot" style="--x:66.0%;--y:1.3%;--w:7.3%;--h:2.6%" data-feature="guestbook" aria-label="Guestbook"></button>
      <button class="hotspot" style="--x:80.0%;--y:0.3%;--w:12.5%;--h:3.7%" data-feature="pass" aria-label="Wedding Pass"></button>

      <!-- Hero -->
      <button class="hotspot" style="--x:20.0%;--y:31.3%;--w:19.0%;--h:4.6%" data-feature="rsvp" aria-label="Join Our Celebration"></button>
      <button class="hotspot" style="--x:14.0%;--y:28.0%;--w:34.0%;--h:3.0%" data-feature="events" aria-label="Wedding in Prayagraj and Reception in Pune"></button>

      <!-- Our Story / The Celebration -->
      <button class="hotspot" style="--x:38.0%;--y:48.2%;--w:16.5%;--h:4.5%" data-feature="story" aria-label="Our Story heading"></button>
      <button class="hotspot" style="--x:39.0%;--y:61.0%;--w:14.5%;--h:4.3%" data-feature="story" aria-label="Read Our Story"></button>
      <button class="hotspot" style="--x:68.0%;--y:49.0%;--w:17.8%;--h:4.2%" data-feature="events" aria-label="The Celebration heading"></button>
      <button class="hotspot" style="--x:67.3%;--y:53.7%;--w:18.8%;--h:4.9%" data-feature="events" aria-label="Wedding in Prayagraj"></button>
      <button class="hotspot" style="--x:67.3%;--y:58.5%;--w:18.8%;--h:4.9%" data-feature="events" aria-label="Reception in Pune"></button>

      <!-- Our Journey / map -->
      <button class="hotspot" style="--x:14.0%;--y:71.5%;--w:13.5%;--h:4.1%" data-feature="map" aria-label="Our Journey"></button>
      <button class="hotspot" style="--x:4.4%;--y:81.9%;--w:10.0%;--h:3.0%" data-feature="map" aria-label="Prayagraj"></button>
      <button class="hotspot" style="--x:29.7%;--y:81.9%;--w:7.0%;--h:3.0%" data-feature="map" aria-label="Pune"></button>
      <button class="hotspot" style="--x:14.6%;--y:84.8%;--w:11.0%;--h:4.1%" data-feature="map" aria-label="View Map"></button>

      <!-- Memories / gallery -->
      <button class="hotspot" style="--x:62.8%;--y:72.0%;--w:18.0%;--h:5.0%" data-feature="memories" aria-label="Wedding Memories"></button>
      <button class="hotspot" style="--x:63.2%;--y:82.8%;--w:13.6%;--h:4.2%" data-feature="memories" aria-label="View Gallery"></button>
    </div>
  </main>

  <div class="modal" id="featureModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button" id="closeModal" aria-label="Close popup">&times;</button>
      <h2 id="modalTitle">Welcome</h2>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
